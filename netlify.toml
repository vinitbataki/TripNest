[build]
  publish = "."

[build.environment]
  # ANTHROPIC_MODEL is a public model name (it appears in the source as a default),
  # not a secret, so exclude it from secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "ANTHROPIC_MODEL"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/photo"
  to = "/.netlify/functions/photo"
  status = 200

[[redirects]]
  from = "/api/places"
  to = "/.netlify/functions/places"
  status = 200

