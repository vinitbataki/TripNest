<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>TripNest – Plan trips together</title>
<style>
:root{--bg:#faf6ee;--card:#fffdf8;--tx:#1f2a44;--mu:#6b6557;--bd:#e3dccb;--g:linear-gradient(135deg,#1f2a44,#7a1f2b 60%,#b8913f);--g2:linear-gradient(135deg,#06b6d4,#6366f1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151f;--card:#1b2030;--tx:#f1ead8;--mu:#a9a392;--bd:#2c3347;--g:linear-gradient(135deg,#8a6a2c,#7a1f2b)}}
:root[data-theme=dark]{--bg:#12151f;--card:#1b2030;--tx:#f1ead8;--mu:#a9a392;--bd:#2c3347;--g:linear-gradient(135deg,#8a6a2c,#7a1f2b)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.logo,.code{font-family:Georgia,"Times New Roman",serif}.ph{filter:saturate(.7)}.ph .hb{filter:none}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body::before{content:"";position:fixed;inset:-20% -10% auto auto;width:60vw;height:60vw;background:var(--g);opacity:.12;filter:blur(90px);z-index:-1;border-radius:50%}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:10px 18px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;transition:.2s;box-shadow:0 6px 18px #1f2a4433}
.btn:hover{transform:translateY(-2px)}.btn.o{background:none;color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.s{padding:6px 12px;font-size:13px}.btn.d{background:#ef4444;box-shadow:none}
input,select,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);margin:5px 0 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:#a67c37;box-shadow:0 0 0 3px #a67c3733}
label{font-size:13px;color:var(--mu);font-weight:600}
.wrap{max-width:1080px;margin:auto;padding:16px}
nav{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;cursor:pointer}
.logo b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.tabs{display:flex;gap:6px;margin:14px 0;overflow-x:auto}
.tab{padding:8px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
.tab.a{background:var(--g);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;transition:.25s;animation:up .4s both}
.ph{background-size:cover;background-position:center}.chip{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:13px;margin:3px 3px 0 0}.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.gal img{width:100%;height:80px;object-fit:cover;border-radius:10px}.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px #1f2a4426}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.ph{height:130px;display:flex;align-items:center;justify-content:center;font-size:58px;position:relative}
.ph .hb{position:absolute;top:8px;right:8px;background:#0003;border:0;border-radius:50%;width:34px;height:34px;color:#fff;cursor:pointer;font-size:16px}
.cb{padding:14px}.cb h3{margin:0 0 4px}.mu{color:var(--mu);font-size:14px}
.hero{border-radius:26px;background:var(--g);color:#fff;padding:32px 24px;margin-bottom:8px}
.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px)}
.auth{max-width:400px;margin:6vh auto;background:var(--card);padding:28px;border-radius:24px;border:1px solid var(--bd);box-shadow:0 20px 50px #1f2a4422}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal>div{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:center}
.pos{color:#10b981;font-weight:700}.neg{color:#ef4444;font-weight:700}
.code{font-size:34px;letter-spacing:8px;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.day{border-left:4px solid #a67c37;padding:4px 0 4px 14px;margin:14px 0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;display:none}
a{color:#7a1f2b;cursor:pointer}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AV=["#1f2a44","#7a1f2b","#a67c37","#2f5d50","#5b3a6b","#8a5a2b"];
const ava=(u,z=34)=>`<span style="display:inline-flex;width:${z}px;height:${z}px;border-radius:50%;background:${AV[u.av||0]};color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:${Math.round(z*.42)}px;flex:none">${esc((u.name||"?")[0]).toUpperCase()}</span>`;
const LOGO=`<svg width="34" height="34" viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2a44"/><stop offset=".6" stop-color="#7a1f2b"/><stop offset="1" stop-color="#c9a24b"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg)"/><path d="M9 22l22-9-8 18-4-7z" fill="#fff"/><path d="M19 24l12-11" stroke="#1f2a44" stroke-width="1.4"/></svg>`;
const D=[["Paris","France","🗼","#f472b6","#6366f1","City of lights, art and cafés"],["Tokyo","Japan","🗾","#f43f5e","#7c3aed","Neon streets and ancient temples"],["Bali","Indonesia","🌴","#10b981","#06b6d4","Rice terraces, beaches, surf"],["New York","USA","🗽","#f59e0b","#ef4444","The city that never sleeps"],["Jaipur","India","🏰","#fb7185","#f59e0b","The Pink City of palaces and forts"],["Goa","India","🏖️","#06b6d4","#10b981","Beaches, shacks and sunsets"],["Manali","India","🏔️","#60a5fa","#6366f1","Himalayan adventure"],["Kerala","India","🛶","#34d399","#0ea5e9","Backwaters and spice hills"],["Rome","Italy","🏛️","#f59e0b","#b91c1c","Eternal city of history"],["Santorini","Greece","🏝️","#38bdf8","#818cf8","White domes over blue sea"],["Dubai","UAE","🌆","#fbbf24","#7c3aed","Skyscrapers and desert"],["London","UK","🎡","#6366f1","#ec4899","Royal history and pubs"],["Bangkok","Thailand","🛕","#f97316","#db2777","Street food and temples"],["Singapore","Singapore","🦁","#14b8a6","#6366f1","Garden city of the future"],["Maldives","Maldives","🐠","#22d3ee","#3b82f6","Overwater villas, coral reefs"],["Swiss Alps","Switzerland","⛷️","#93c5fd","#a78bfa","Snowy peaks and trains"],["Cape Town","South Africa","🦒","#f59e0b","#0ea5e9","Table Mountain and wine"],["Sydney","Australia","🦘","#06b6d4","#f43f5e","Harbour, opera house, beaches"],["Istanbul","Turkey","🕌","#ef4444","#a67c37","Where East meets West"],["Barcelona","Spain","⛪","#f97316","#ec4899","Gaudí, tapas, beach"],["Kyoto","Japan","⛩️","#f472b6","#f59e0b","Geisha, gardens, shrines"],["Udaipur","India","🛥️","#a78bfa","#f472b6","City of lakes"],["Ladakh","India","🏍️","#38bdf8","#10b981","High passes and monasteries"],["Reykjavik","Iceland","🌌","#22d3ee","#7c3aed","Northern lights and geysers"]];
const dest=n=>D.find(d=>d[0].toLowerCase()==String(n).toLowerCase())||[n,"","📍","#1f2a44","#7a1f2b","Your custom destination"];
const art=d=>`background:linear-gradient(135deg,${d[3]},${d[4]})`;
let S={users:[],trips:[],saved:{},me:null},V={page:"auth",mode:"in",tab:"trips",trip:null,tt:"plan",q:""};
const load=()=>{try{S=Object.assign(S,JSON.parse(localStorage.getItem("tripnest")||"{}"))}catch(e){}};
const save=()=>{try{localStorage.setItem("tripnest",JSON.stringify(S))}catch(e){}window.cloudPush&&cloudPush()};
const uid=()=>Math.random().toString(36).slice(2,10),gen=()=>String(Math.floor(100000+Math.random()*900000));
const hash=async s=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(s)}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2400)};
const me=()=>S.users.find(u=>u.id==S.me);
const trip=()=>S.trips.find(t=>t.id==V.trip);
const mine=()=>S.trips.filter(t=>t.members.some(m=>m.id==S.me));
const go=(p,x={})=>{Object.assign(V,{page:p},x);render()};
const link=c=>location.origin+location.pathname+"#join-"+c;
function nav(){const u=me();return`<nav><div class="logo" onclick="go('home')">${LOGO}<b>TripNest</b></div><div class="sp"></div>${u?`<a onclick="go('profile')" title="My profile" style="display:flex;align-items:center;gap:8px;color:var(--tx);font-weight:600">${ava(u)}<span>${esc(u.name.split(" ")[0])}</span></a><button class="btn o s" onclick="logout()">Logout</button>`:""}<button class="btn o s" onclick="theme()" aria-label="Toggle theme">🌓</button></nav>`}
function theme(){const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}
async function signup(){const n=$("#n").value.trim(),e=$("#e").value.trim().toLowerCase(),p=$("#p").value;if(!n||!e.includes("@")||p.length<6)return toast("Enter name, valid email and 6+ char password");if(S.users.find(u=>u.email==e))return toast("Email already registered");const u={id:uid(),name:n,email:e,pw:await hash(p)};S.users.push(u);S.me=u.id;save();afterAuth()}
async function login(){const e=$("#e").value.trim().toLowerCase(),p=await hash($("#p").value),u=S.users.find(u=>u.email==e&&u.pw==p);if(!u)return toast("Wrong email or password");S.me=u.id;save();afterAuth()}
async function reset(){const e=$("#e").value.trim().toLowerCase(),p=$("#p").value,u=S.users.find(u=>u.email==e);if(!u)return toast("No account with that email");if(p.length<6)return toast("New password needs 6+ characters");u.pw=await hash(p);save();toast("Password updated. Please sign in");go("auth",{mode:"in"})}
function logout(){S.me=null;save();go("auth",{mode:"in"})}
function afterAuth(){const m=location.hash.match(/join-(\d{6})/);if(m){joinCode(m[1]);history.replaceState(null,"",location.pathname)}else go("home",{tab:"trips"})}
function joinCode(c){const t=S.trips.find(t=>t.code==c);if(!t)return toast("Invalid trip code"),go("home");if(!t.members.some(m=>m.id==S.me)){t.members.push({id:S.me,name:me().name});save()}toast("Joined "+t.name+" 🎉");go("trip",{trip:t.id,tt:"plan"})}
function authView(){const m=V.mode,T={in:"Welcome back",up:"Create account",fg:"Reset password"}[m];return`<div class="auth"><div style="text-align:center">${LOGO}<h2 style="margin:8px 0">${T}</h2><p class="mu">Plan, share and split trips with friends</p></div>
${m=="up"?'<label>Full name</label><input id="n" autocomplete="name">':""}<label>Email</label><input id="e" type="email" autocomplete="email"><label>${m=="fg"?"New password":"Password"}</label><input id="p" type="password" autocomplete="${m=="in"?"current-password":"new-password"}" onkeydown="if(event.key=='Enter')document.querySelector('.auth .btn').click()">
<button class="btn" style="width:100%" onclick="${{in:"login",up:"signup",fg:"reset"}[m]}()">${{in:"Sign in",up:"Sign up",fg:"Reset password"}[m]}</button>
<p class="mu" style="text-align:center">${m=="in"?`<a onclick="go('auth',{mode:'fg'})">Forgot password?</a> · <a onclick="go('auth',{mode:'up'})">Create account</a>`:`<a onclick="go('auth',{mode:'in'})">Back to sign in</a>`}</p>
${location.hash.includes("join-")?'<p class="mu" style="text-align:center">Sign in to join the shared trip ✈️</p>':""}</div>`}
function destCard(d,i){const sv=(S.saved[S.me]||[]).includes(d[0]);return`<div class="card" style="animation-delay:${i*30}ms"><div class="ph" data-d="${esc(d[0])}" style="${art(d)};cursor:pointer" onclick="info('${d[0]}')">${d[2]}<button class="hb" onclick="event.stopPropagation();toggleSave('${d[0]}')" aria-label="Save">${sv?"❤️":"🤍"}</button></div><div class="cb"><h3>${esc(d[0])}</h3><div class="mu">${esc(d[1])} · ${esc(d[5])}</div><div class="row" style="margin-top:10px"><button class="btn o s" onclick="info('${d[0]}')">Details</button><button class="btn s" onclick="newTrip('${d[0]}')">Plan trip</button></div></div></div>`}
function toggleSave(n){const a=S.saved[S.me]=S.saved[S.me]||[],i=a.indexOf(n);i<0?a.push(n):a.splice(i,1);save();render()}
function homeView(){const T=mine(),sv=S.saved[S.me]||[],q=V.q.toLowerCase();
let body="";
if(V.tab=="trips")body=T.length?`<div class="grid">${T.map((t,i)=>{const d=dest(t.dest);return`<div class="card" style="animation-delay:${i*40}ms"><div class="ph" data-d="${esc(t.dest)}" style="${art(d)}">${d[2]}</div><div class="cb"><h3>${esc(t.name)}</h3><div class="mu">${esc(t.dest)} · ${esc(t.start||"Dates TBD")}${t.end?" → "+esc(t.end):""}</div><div class="mu">👥 ${t.members.length} · 💸 ${t.exp.length} expenses</div><div class="row" style="margin-top:10px"><button class="btn s" onclick="go('trip',{trip:'${t.id}',tt:'plan'})">Open</button>${t.owner==S.me?`<button class="btn d s" onclick="delTrip('${t.id}')">Delete</button>`:`<button class="btn o s" onclick="leave('${t.id}')">Leave</button>`}</div></div></div>`}).join("")}</div>`:`<div class="card cb" style="text-align:center;padding:40px"><div style="font-size:50px">🧳</div><h3>No trips yet</h3><p class="mu">Create one manually, let AI plan it, or join with a code.</p></div>`;
else if(V.tab=="saved")body=sv.length?`<div class="grid">${sv.map((n,i)=>destCard(dest(n),i)).join("")}</div>`:`<p class="mu">Tap 🤍 on any destination to save it here.</p>`;
else{const r=D.filter(d=>(d[0]+d[1]+d[5]).toLowerCase().includes(q));body=`<input id="q" placeholder="🔍 Search places (e.g. Goa, beach, Japan)…" value="${esc(V.q)}" oninput="V.q=this.value;sr()" style="font-size:16px"><div id="res">${resList(r)}</div>`}
return`<div class="wrap"><div class="hero"><h1>Where to next? ✨</h1><p style="margin:0 0 16px">Plan with AI, share with friends, split every expense.</p><div class="row" style="max-width:520px"><button class="btn" style="background:#fff;color:#1f2a44" onclick="newTrip()">＋ New trip</button><button class="btn" style="background:#ffffff33" onclick="joinModal()">🔑 Join with code</button></div></div>
<div class="tabs">${[["trips","🧳 My trips"],["saved","❤️ Saved"],["explore","🔍 Explore"]].map(([k,l])=>`<div class="tab ${V.tab==k?"a":""}" onclick="go('home',{tab:'${k}'})">${l}</div>`).join("")}</div>${body}</div>`}
const resList=r=>r.length?`<div class="grid">${r.map(destCard).join("")}</div>`:`<p class="mu">No match. <a onclick="newTrip(V.q)">Plan a trip to “${esc(V.q)}” anyway</a></p>`;
function sr(){const q=V.q.toLowerCase();$("#res").innerHTML=resList(D.filter(d=>(d[0]+d[1]+d[5]).toLowerCase().includes(q)));loadPhotos()}
function modal(h){const m=document.createElement("div");m.className="modal";m.id="md";m.innerHTML=`<div>${h}</div>`;m.onclick=e=>{if(e.target==m)m.remove()};document.body.appendChild(m)}
const closeM=()=>$("#md")?.remove();
const ask=(t,v,cb)=>{window._cb=cb;modal(`<h2 style="margin-top:0">${t}</h2><input id="ak" value="${esc(v)}" onkeydown="if(event.key=='Enter')document.getElementById('okb').click()"><div class="row"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn" id="okb" onclick="const x=$('#ak').value;closeM();_cb(x)">OK</button></div>`);setTimeout(()=>$("#ak")?.focus(),50)};
function newTrip(d=""){closeM();modal(`<h2 style="margin-top:0">Create trip</h2><label>Trip name</label><input id="tn" placeholder="Summer with the gang"><label>Destination</label><input id="td" list="dl" value="${esc(d)}" placeholder="Pick or type any place"><datalist id="dl">${D.map(x=>`<option>${x[0]}</option>`).join("")}</datalist><div class="row"><div><label>Start</label><input id="ts" type="date"></div><div><label>End</label><input id="te" type="date"></div></div><label><input type="checkbox" id="ai" checked style="width:auto;margin-right:6px">Generate AI itinerary</label><br><br><div class="row"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn" onclick="mkTrip()">Create</button></div>`)}
async function mkTrip(){const dd=$("#td").value.trim();if(!dd)return toast("Enter a destination");const t={id:uid(),name:$("#tn").value.trim()||"Trip to "+dd,dest:dd,start:$("#ts").value,end:$("#te").value,owner:S.me,members:[{id:S.me,name:me().name}],code:gen(),itin:[],exp:[]};S.trips.push(t);save();const ai=$("#ai").checked;closeM();go("trip",{trip:t.id,tt:"plan"});if(ai)aiPlan()}
function delTrip(id){modal(`<h2 style="margin-top:0">Delete trip?</h2><p class="mu">This removes it for everyone.</p><div class="row"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn d" onclick="closeM();doDel('${id}')">Delete</button></div>`)}
function doDel(id){S.trips=S.trips.filter(t=>t.id!=id);save();toast("Trip deleted");if(V.page=="trip")go("home");else render()}
function leave(id){const t=S.trips.find(t=>t.id==id);t.members=t.members.filter(m=>m.id!=S.me);save();render()}
function joinModal(){modal(`<h2 style="margin-top:0">Join a trip</h2><label>6-digit code</label><input id="jc" inputmode="numeric" maxlength="6" placeholder="123456" style="font-size:26px;letter-spacing:6px;text-align:center"><div class="row"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn" onclick="closeM();joinCode($('#jc').value.trim())">Join</button></div>`)}
function days(t){let n=5;if(t.start&&t.end){const x=Math.round((new Date(t.end)-new Date(t.start))/864e5)+1;if(x>0&&x<=14)n=x}return n}
async function aiJson(p){try{const s=window.claude?await claude.use("sample"):null;if(s)return await s.json(p)}catch(e){}
const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p})});if(!r.ok)throw new Error("AI request failed");const{text}=await r.json();const m=text.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m[0])}
async function aiPlan(){const t=trip(),n=days(t);const box=$("#ai-st");if(box)box.textContent="✨ Claude is planning…";let it=null;
try{{const r=await aiJson(`Create a ${n}-day travel itinerary for ${t.dest}. Return ONLY JSON: [{"day":1,"title":"short theme","items":["Morning: ...","Afternoon: ...","Evening: ..."]}] with exactly ${n} days, specific real places and local food tips.`);if(Array.isArray(r))it=r}}catch(e){}
if(!it){const a=["Arrival, old town walk and local dinner","Top landmarks and museums","Local food tour and markets","Nature escape or day trip","Hidden gems, shopping and relaxing","Sunset viewpoint and farewell dinner","Cultural experience and workshops"];it=Array.from({length:n},(_,i)=>({day:i+1,title:a[i%a.length],items:[`Morning: explore ${t.dest} highlights`,"Afternoon: lunch at a well-reviewed local spot, then sightseeing","Evening: dinner and a stroll"]}));toast("AI unavailable, used smart template")}
t.itin=it.map(d=>({title:String(d.title||""),items:(d.items||[]).map(String)}));save();render()}
function addDay(){const t=trip();t.itin.push({title:"New day",items:[]});save();render()}
function addItem(i){ask("Add activity","",v=>{if(!v.trim())return;trip().itin[i].items.push(v.trim());save();render()})}
function rmItem(i,j){trip().itin[i].items.splice(j,1);save();render()}
function rmDay(i){trip().itin.splice(i,1);save();render()}
function ttl(i){ask("Day title",trip().itin[i].title,v=>{trip().itin[i].title=v;save();render()})}
function planTab(t){return`<div class="row" style="margin-bottom:8px"><button class="btn" onclick="aiPlan()">✨ ${t.itin.length?"Regenerate":"Generate"} AI itinerary</button><button class="btn o" onclick="addDay()">＋ Add day</button></div><div id="ai-st" class="mu"></div>${t.itin.map((d,i)=>`<div class="day"><div class="li" style="border:0"><b>Day ${i+1}: ${esc(d.title)}</b><span><button class="btn o s" onclick="ttl(${i})">✏️</button> <button class="btn o s" onclick="rmDay(${i})">🗑</button></span></div>${d.items.map((x,j)=>`<div class="li"><span>${esc(x)}</span><a onclick="rmItem(${i},${j})">✕</a></div>`).join("")}<button class="btn o s" style="margin-top:8px" onclick="addItem(${i})">＋ Activity</button></div>`).join("")||'<p class="mu">No itinerary yet. Generate one with AI or add days manually.</p>'}`}
function bal(t){const n={};t.members.forEach(m=>n[m.id]=0);t.exp.forEach(e=>{const sp=e.split.filter(x=>x in n);if(!sp.length)return;n[e.by]=(n[e.by]||0)+e.amt;sp.forEach(x=>n[x]-=e.amt/sp.length)});return n}
function settle(t){const n=bal(t),c=Object.entries(n).filter(([,v])=>v<-.01).map(([k,v])=>[k,-v]).sort((a,b)=>b[1]-a[1]),r=Object.entries(n).filter(([,v])=>v>.01).sort((a,b)=>b[1]-a[1]),o=[];let i=0,j=0;while(i<c.length&&j<r.length){const a=Math.min(c[i][1],r[j][1]);o.push([c[i][0],r[j][0],a]);c[i][1]-=a;r[j][1]-=a;if(c[i][1]<.01)i++;if(r[j][1]<.01)j++}return o}
const nm=(t,id)=>t.members.find(m=>m.id==id)?.name||"Member",f=x=>"₹"+x.toFixed(2);
function expModal(){const t=trip();modal(`<h2 style="margin-top:0">Add expense</h2><label>What for?</label><input id="et" placeholder="Dinner, taxi…"><label>Amount (₹)</label><input id="ea" type="number" min="0" step="0.01"><label>Paid by</label><select id="eb">${t.members.map(m=>`<option value="${m.id}" ${m.id==S.me?"selected":""}>${esc(m.name)}</option>`).join("")}</select><label>Split equally between</label>${t.members.map(m=>`<div><label style="color:var(--tx)"><input type="checkbox" class="sp-c" value="${m.id}" checked style="width:auto;margin-right:8px">${esc(m.name)}</label></div>`).join("")}<br><div class="row"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn" onclick="addExp()">Add</button></div>`)}
function addExp(){const a=parseFloat($("#ea").value),sp=[...document.querySelectorAll(".sp-c:checked")].map(x=>x.value);if(!(a>0)||!sp.length||!$("#et").value.trim())return toast("Fill title, amount and who splits");trip().exp.push({id:uid(),title:$("#et").value.trim(),amt:a,by:$("#eb").value,split:sp,date:new Date().toLocaleDateString()});save();closeM();render()}
function rmExp(id){const t=trip();t.exp=t.exp.filter(e=>e.id!=id);save();render()}
function expTab(t){const b=bal(t),tot=t.exp.reduce((s,e)=>s+e.amt,0),st=settle(t);return`<div class="row"><button class="btn" onclick="expModal()">＋ Add expense</button><div class="card cb" style="flex:2"><span class="mu">Total spent</span><h2 style="margin:0">${f(tot)}</h2></div></div><h3>Balances</h3>${t.members.map(m=>`<div class="li"><span>${esc(m.name)}</span><span class="${b[m.id]>=0?"pos":"neg"}">${b[m.id]>=0?"gets back ":"owes "}${f(Math.abs(b[m.id]))}</span></div>`).join("")}<h3>How to settle up</h3>${st.map(([a,c,x])=>`<div class="li"><span>${esc(nm(t,a))} → ${esc(nm(t,c))}</span><b>${f(x)}</b></div>`).join("")||'<p class="mu">All settled 🎉</p>'}<h3>Expenses</h3>${t.exp.slice().reverse().map(e=>`<div class="li"><span><b>${esc(e.title)}</b><br><span class="mu">${esc(nm(t,e.by))} paid · split ${e.split.length} · ${esc(e.date)}</span></span><span>${f(e.amt)} <a onclick="rmExp('${e.id}')">✕</a></span></div>`).join("")||'<p class="mu">No expenses yet.</p>'}`}
function copy(s){navigator.clipboard?.writeText(s).then(()=>toast("Copied!"),()=>toast(s))}
function memTab(t){return`<div class="card cb" style="text-align:center"><span class="mu">Trip join code</span><div class="code">${t.code}</div><div class="row"><button class="btn o s" onclick="copy('${t.code}')">Copy code</button><button class="btn s" onclick="copy('${link(t.code)}')">Copy share link</button></div></div><h3>Members (${t.members.length})</h3>${t.members.map(m=>`<div class="li"><span style="display:flex;align-items:center;gap:10px">${ava(S.users.find(u=>u.id==m.id)||{name:m.name},30)}${esc(m.name)} ${m.id==t.owner?"👑":""}</span></div>`).join("")}<p class="mu">Note: this build stores data in this browser. See the notes for connecting a real backend so members on other devices can join.</p>`}
function tripView(){const t=trip();if(!t)return go("home"),"";const d=dest(t.dest);return`<div class="wrap"><a onclick="go('home')">← All trips</a><div class="hero" style="${art(d)};margin-top:10px"><div style="font-size:48px">${d[2]}</div><h1>${esc(t.name)}</h1><div>${esc(t.dest)} · ${esc(t.start||"Dates TBD")}${t.end?" → "+esc(t.end):""}</div></div><div class="tabs">${[["plan","🗺 Itinerary"],["exp","💸 Expenses"],["mem","👥 Members"]].map(([k,l])=>`<div class="tab ${V.tt==k?"a":""}" onclick="V.tt='${k}';render()">${l}</div>`).join("")}${t.owner==S.me?`<div class="tab" onclick="delTrip('${t.id}')">🗑 Delete</div>`:""}</div>${{plan:planTab,exp:expTab,mem:memTab}[V.tt](t)}</div>`}

const PC={};
async function photo(n){if(n in PC)return PC[n];try{const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(n));const j=await r.json();const u=j.thumbnail?.source;return PC[n]=u?u.replace(/\/\d+px-/,"/800px-"):null}catch(e){return PC[n]=null}}
async function photos(n){try{const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/media-list/"+encodeURIComponent(n));const j=await r.json();return(j.items||[]).filter(x=>x.type=="image"&&x.srcset?.length).slice(0,6).map(x=>"https:"+x.srcset[0].src)}catch(e){return[]}}
function loadPhotos(){document.querySelectorAll(".ph[data-d]").forEach(async el=>{const u=await photo(el.dataset.d);if(u&&el.isConnected){el.style.backgroundImage=`linear-gradient(#0001,#0003),url(${u})`;el.style.fontSize="0"}})}
async function info(n){const d=dest(n);modal(`<div class="ph" data-d="${esc(d[0])}" style="${art(d)};height:190px;border-radius:16px">${d[2]}</div><h2 style="margin:12px 0 2px">${esc(d[0])}${d[1]?", "+esc(d[1]):""}</h2><div class="mu">${esc(d[5])}</div><div id="gal" class="gal"></div><div id="dinfo" class="mu">✨ Loading travel details…</div><div class="row" style="margin-top:14px"><button class="btn o" onclick="closeM()">Close</button><button class="btn" onclick="closeM();newTrip('${esc(d[0])}')">Plan trip</button></div>`);loadPhotos();
photos(n).then(a=>{const g=$("#gal");if(g)g.innerHTML=a.map(u=>`<img src="${esc(u)}" loading="lazy" alt="">`).join("")});
let r=null;try{r=await aiJson(`Travel facts for ${n}. Return ONLY JSON: {"best":"best months to visit","budget":"approx daily budget per person in INR","stay":"best area to stay","highlights":["5 top places"],"food":["3 local dishes"],"tip":"one practical tip"}`)}catch(e){}
const b=$("#dinfo");if(!b)return;if(!r||!r.highlights){b.textContent="Details unavailable right now.";return}
const ch=a=>(a||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("");
b.className="";b.innerHTML=`<p>📅 <b>Best time:</b> ${esc(r.best)}<br>💰 <b>Budget:</b> ${esc(r.budget)}<br>🏨 <b>Stay:</b> ${esc(r.stay)}</p><b>📍 Highlights</b><div>${ch(r.highlights)}</div><br><b>🍽 Must try</b><div>${ch(r.food)}</div><p class="mu">💡 ${esc(r.tip)}</p>`}

function readPf(){const u=me(),n=$("#pn")?.value.trim();if(n)u.name=n;u.city=$("#pc")?.value??u.city;u.bio=$("#pb")?.value??u.bio}
function pickAv(i){readPf();me().av=i;save();render()}
function saveProfile(){readPf();const u=me();if(!u.name)return toast("Name is required");S.trips.forEach(t=>t.members.forEach(m=>{if(m.id==u.id)m.name=u.name}));save();toast("Profile saved ✓");render()}
async function changePw(){const u=me(),c=await hash($("#cp").value),n=$("#np").value;if(c!=u.pw)return toast("Current password is wrong");if(n.length<6)return toast("New password needs 6+ characters");u.pw=await hash(n);save();$("#cp").value=$("#np").value="";toast("Password changed ✓")}
function delAcct(){modal(`<h2 style="margin-top:0">Delete account?</h2><p class="mu">Your profile and saved places are removed. Trips you own move to another member, or are deleted if you are the only one.</p><div class="row"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn d" onclick="closeM();doDelAcct()">Delete</button></div>`)}
function doDelAcct(){const id=S.me;S.trips.forEach(t=>{t.members=t.members.filter(m=>m.id!=id);if(t.owner==id&&t.members.length)t.owner=t.members[0].id});S.trips=S.trips.filter(t=>t.members.length);S.users=S.users.filter(u=>u.id!=id);delete S.saved[id];S.me=null;save();toast("Account deleted");go("auth",{mode:"up"})}
function profileView(){const u=me(),T=mine(),sv=(S.saved[u.id]||[]).length,paid=S.trips.flatMap(t=>t.exp.filter(e=>e.by==u.id)).reduce((a,e)=>a+e.amt,0);
return`<div class="wrap" style="max-width:640px"><a onclick="go('home')">← Back</a>
<div class="card cb" style="text-align:center;margin-top:10px;padding:24px">${ava(u,88)}<h2 style="margin:10px 0 2px">${esc(u.name)}</h2><div class="mu">${esc(u.email)}${u.city?" · 📍 "+esc(u.city):""}</div>${u.bio?`<p>${esc(u.bio)}</p>`:""}<div class="row" style="margin-top:14px"><div><h3 style="margin:0">${T.length}</h3><span class="mu">Trips</span></div><div><h3 style="margin:0">${sv}</h3><span class="mu">Saved</span></div><div><h3 style="margin:0">${f(paid)}</h3><span class="mu">Paid</span></div></div></div>
<div class="card cb" style="margin-top:14px"><h3>Edit profile</h3><label>Avatar colour</label><div class="row" style="margin:6px 0 12px">${AV.map((c,i)=>`<button onclick="pickAv(${i})" aria-label="Colour ${i+1}" style="flex:none;width:34px;height:34px;border-radius:50%;background:${c};border:3px solid ${(u.av||0)==i?"var(--tx)":"transparent"};cursor:pointer"></button>`).join("")}</div><label>Full name</label><input id="pn" value="${esc(u.name)}"><label>Email (cannot be changed)</label><input value="${esc(u.email)}" disabled><label>Home city</label><input id="pc" value="${esc(u.city||"")}" placeholder="Jaipur"><label>About you</label><textarea id="pb" rows="3" placeholder="Favourite kind of trip…">${esc(u.bio||"")}</textarea><button class="btn" onclick="saveProfile()">Save profile</button></div>
<div class="card cb" style="margin-top:14px"><h3>Change password</h3><label>Current password</label><input id="cp" type="password" autocomplete="current-password"><label>New password</label><input id="np" type="password" autocomplete="new-password"><button class="btn o" onclick="changePw()">Update password</button></div>
<div class="card cb" style="margin-top:14px"><h3>Account</h3><div class="row"><button class="btn o" onclick="logout()">Logout</button><button class="btn d" onclick="delAcct()">Delete account</button></div></div></div>`}

function render(){if(!me()&&V.page!="auth")V.page="auth";const p=V.page;$("#app").innerHTML=nav()+(p=="auth"?authView():p=="trip"?tripView():p=="profile"?profileView():homeView());loadPhotos()}
window.bootLocal=function(){load();if(me())V.page="home";
const jm=location.hash.match(/join-(\d{6})/);if(jm&&me()){joinCode(jm[1]);history.replaceState(null,"",location.pathname)}else render();};
</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="cloud.js"></script>
<script>(window.cloudBoot||bootLocal)()</script>
</body></html>
